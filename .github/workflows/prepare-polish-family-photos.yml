name: Prepare family photos for Polish-market preview

on:
  push:
    branches: [family-editorial-poland-3-2]
    paths: [.github/workflows/prepare-polish-family-photos.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and optimize licensed stock photos
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps
          import urllib.request
          photos=[
            ("hero-parents-baby",7220468,1280),
            ("segment-baby",4424342,920),
            ("segment-preschool",1471843,920),
            ("segment-toddler",17309023,920),
            ("mamaklub-family",3625705,1040),
          ]
          dest=Path("assets/families")
          dest.mkdir(parents=True,exist_ok=True)
          for name,photo_id,max_width in photos:
            url=f"https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1480"
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (PresentService Editorial Preview)"})
            with urllib.request.urlopen(req,timeout=45) as r:
              payload=r.read()
            if not 15_000<len(payload)<15_000_000:raise RuntimeError(f"Invalid size for {photo_id}: {len(payload)}")
            img=ImageOps.exif_transpose(Image.open(BytesIO(payload))).convert("RGB")
            if img.width>max_width:
              img=img.resize((max_width,round(img.height*max_width/img.width)),Image.Resampling.LANCZOS)
            target=dest/f"{name}.webp"
            img.save(target,"WEBP",quality=82,method=6)
            size=target.stat().st_size
            if size>600_000:raise RuntimeError(f"Too large: {target.name} {size}")
            print(f"PHOTO {photo_id} {name}: {img.width}x{img.height}; {size} bytes")
          PY
      - name: Commit images to isolated preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/families/
          if git diff --cached --quiet; then
            echo "No changed images"
          else
            git commit -m "assets: refresh editorial family photography with Polish-located scenes"
            git push origin HEAD:family-editorial-poland-3-2
          fi
