name: Replace two family-card photographs
on:
  push:
    branches: [poland-two-card-images-3-3]
    paths: [.github/workflows/replace-two-card-photos.yml]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimize two new illustrative scenes
        run: |
          python3 -m pip install --break-system-packages --quiet pillow
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image,ImageOps
          import urllib.request
          photos=[("segment-baby",6849278),("segment-preschool",22690879)]
          target=Path("assets/families")
          for name,photo_id in photos:
            url=f"https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1450"
            request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(request,timeout=40) as response: data=response.read()
            if not 15000<len(data)<12000000: raise RuntimeError(f"Bad size {name}: {len(data)}")
            img=ImageOps.exif_transpose(Image.open(BytesIO(data))).convert("RGB")
            width=920
            img=img.resize((width,round(width*img.height/img.width)),Image.Resampling.LANCZOS)
            path=target/f"{name}.webp"
            img.save(path,"WEBP",quality=82,method=6)
            if path.stat().st_size>350000: raise RuntimeError(f"Unoptimized {path}")
            print("REPLACED",photo_id,name,img.width,img.height,path.stat().st_size)
          PY
      - name: Commit only the two image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/families/segment-baby.webp assets/families/segment-preschool.webp
          git commit -m "assets: replace close-up and unsuitable preschool photos with family scenes"
          git push origin HEAD:poland-two-card-images-3-3
