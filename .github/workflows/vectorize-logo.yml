name: Generate sharp Present-Service vector logo
on:
  push:
    branches: [logo-vector-3-5]
    paths: [.github/workflows/vectorize-logo.yml]
permissions:
  contents: write
jobs:
  vectorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install vectorizer dependencies
        run: python3 -m pip install --break-system-packages --quiet pillow numpy opencv-python-headless
      - name: Trace original PNG to clean SVG outlines
        run: python3 scripts/vectorize-logo.py
      - name: Verify vector and browser-independent metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('assets/present-service-logo.svg')
          s=p.read_text()
          root=ET.fromstring(s)
          ns={'s':'http://www.w3.org/2000/svg'}
          paths=root.findall('s:path',ns)
          assert len(paths)==2, 'expected exactly two path elements'
          assert root.get('viewBox')=='0 0 212 33'
          assert '<image' not in s and 'base64' not in s
          assert 1000<p.stat().st_size<40000
          print('SVG VERIFIED:',p.stat().st_size,'bytes')
          PY
      - name: Commit generated SVG only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/present-service-logo.svg
          if git diff --cached --quiet; then
            echo "Already current"
          else
            git commit -m "assets: add sharp, genuine outline SVG traced from official PNG"
            git push origin HEAD:logo-vector-3-5
          fi
