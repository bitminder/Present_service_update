name: 'Browser audit - data experience 3.0'

on:
  push:
    branches:
      - audit-v2-browser
      - premium-design-2-1
      - data-first-2-2
      - data-experience-3-0
  workflow_dispatch:

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static site and scripts
        run: |
          node --check app.js
          node --check --input-type=module < backend/lead-worker.js
          node scripts/check-site.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.57.0 axe-core@4.11.0
          npx playwright install --with-deps chromium
      - name: Start local preview (audit branch)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/present-service-browser-audit-server.log 2>&1 &
          sleep 2
      - name: Run browser smoke tests on audit branch
        env:
          BASE_URL: http://127.0.0.1:8765/
        run: |
          mkdir -p artifacts
          node scripts/audit-browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: present-service-v2-browser-audit
          path: artifacts/
          retention-days: 3
