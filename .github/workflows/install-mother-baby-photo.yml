name: Install approved mother and baby photo
on:
  push:
    branches: [mother-baby-card-3-4]
    paths: [.github/workflows/install-mother-baby-photo.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and crop one Pexels photo to the actual card ratio
        run: |
          python3 -m pip install --break-system-packages --quiet pillow
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps
          import urllib.request
          photo_id=27176833
          url=f"https://images.pexels.com/photos/{photo_id}/pexels-photo-{photo_id}.jpeg?auto=compress&cs=tinysrgb&w=1600"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=40) as response: blob=response.read()
          assert 15000<len(blob)<10000000, "Unexpected image size"
          photo=ImageOps.exif_transpose(Image.open(BytesIO(blob))).convert("RGB")
          # Same 920:580 aspect ratio as the live segment card, both mother and baby visible
          crop=ImageOps.fit(photo,(920,580),method=Image.Resampling.LANCZOS,centering=(.5,.5))
          dest=Path("assets/families/segment-baby-mama.webp")
          crop.save(dest,"WEBP",quality=82,method=6)
          assert 15000<dest.stat().st_size<300000, "Unexpected output size"
          print("NEW MOTHER AND BABY PHOTO",dest, crop.size, dest.stat().st_size)
          PY
      - name: Commit one replacement asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/families/segment-baby-mama.webp
          git rm assets/families/segment-baby.webp
          git commit -m "assets: replace baby card with centered mother-and-newborn photo"
          git push origin HEAD:mother-baby-card-3-4
